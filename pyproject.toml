[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-plane"
version = "0.1.0"
description = "Provider-neutral control plane for supervised CLI coding workers"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentctl = "agentctl.cli:main"

[tool.setuptools]
packages = ["agentctl"]
